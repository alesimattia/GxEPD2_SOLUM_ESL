sentence=Driver GxEPD2 per pannelli e-paper SOLUM ESL a 4 colori su controller SSD1677.
paragraph=Estende GxEPD2 con il driver header-only del pannello SOLUM ESL 9.7" 672x960 BWRY (bianco/nero/rosso/giallo su tre piani RAM separati, comandi 0x24 / 0x26 / 0x28), che upstream non supporta. Include GxEPDImage::showImage() e il sistema di descrittori immagine BW / BWR / BWRY. Richiede GxEPD2 e Adafruit_GFX. Solo ESP32. Attenzione: il pannello richiede alimentazione 3.3V su VCC E sulle data line.
category=Display
