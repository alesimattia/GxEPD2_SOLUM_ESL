sentence=Driver GxEPD2 per pannelli e-paper recuperati da etichette elettroniche SOLUM ESL.
paragraph=Estende GxEPD2 con due driver header-only che upstream non supporta. SOLUM 9.7" 960x672 su SSD1677: bianco/nero/rosso (RAM 0x24 / 0x26), in uso e verificato, con un partial veloce in bianco e nero. SOLUM 12.2" 960x768 su due controller SSD16xx da 960x384: validata una sola banda. Entrambi condividono GxEPDImage::showImage() e il sistema di descrittori immagine BW / BWR / BWRY. Richiede GxEPD2 e Adafruit_GFX. Solo ESP32. Attenzione: i pannelli richiedono alimentazione 3.3V su VCC E sulle data line.
category=Display
url=https://github.com/alesimattia/GxEPD2_SOLUM_ESL
architectures=esp32
depends=GxEPD2 (>=1.6.9),Adafruit GFX Library
