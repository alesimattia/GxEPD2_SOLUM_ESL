sentence=Driver GxEPD2 per pannelli e-paper recuperati da etichette elettroniche SOLUM ESL.
paragraph=Estende GxEPD2 con due driver header-only che upstream non supporta. SOLUM 9.7" 672x960 su SSD1677: bianco/nero/rosso piu un terzo piano RAM (comandi 0x24 / 0x26 / 0x28), in uso e verificato. SOLUM 12.2" 960x768 su assumption UC8179 dual-controller: NON validato su hardware, il controller stesso e in discussione. Entrambi condividono GxEPDImage::showImage() e il sistema di descrittori immagine BW / BWR / BWRY. Richiede GxEPD2 e Adafruit_GFX. Solo ESP32. Attenzione: i pannelli richiedono alimentazione 3.3V su VCC E sulle data line.
category=Display
url=https://github.com/alesimattia/GxEPD2_SOLUM_ESL
architectures=esp32
depends=GxEPD2 (>=1.6.9),Adafruit GFX Library
